global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'eureka'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka:8761']

  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:9090']

  - job_name: 'user'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['user:8024']

  - job_name: 'forum'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['forum:8023']

  - job_name: 'quiz'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['quiz:8025']

  - job_name: 'course'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['course:8086']

  - job_name: 'formation'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['formation:8084']

  - job_name: 'certificat'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['certificat:8022']

  - job_name: 'eventgestion'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eventgestion:8082']

  - job_name: 'job-offer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['job-offer:8083']

  - job_name: 'payment'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment:8075']

  - job_name: 'ticket'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ticket:8000']

  - job_name: 'entreprise'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['entreprise:8085']

  - job_name: 'internship-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['internship-service:8087']
