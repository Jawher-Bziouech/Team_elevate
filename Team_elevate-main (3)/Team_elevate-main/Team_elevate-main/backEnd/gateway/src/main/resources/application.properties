spring.cloud.gateway.routes[17].uri=http://localhost:8000
spring.cloud.gateway.routes[17].predicates[0]=Path=/api/resume/**

# ROUTE INTERNSHIP SERVICE - Internship Offers
spring.cloud.gateway.routes[18].id=internship-service-internships
spring.cloud.gateway.routes[18].uri=lb://internship-service
spring.cloud.gateway.routes[18].predicates[0]=Path=/api/internships/**

