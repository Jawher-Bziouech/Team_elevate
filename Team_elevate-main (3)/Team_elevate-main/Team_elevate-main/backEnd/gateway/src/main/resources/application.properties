spring.cloud.gateway.routes[21].uri=lb://internship-service
spring.cloud.gateway.routes[21].predicates[0]=Path=/api/internship-resume/**

# Global CORS Configuration for the Gateway
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
# Add this line to remove duplicate CORS headers
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
# LOGS (pour voir le load balancing)
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# Enable Gateway Swagger Aggregation
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# Certificat Service Documentation
springdoc.swagger-ui.urls[0].name=Certificat API
springdoc.swagger-ui.urls[0].url=/certificats/v3/api-docs


springdoc.swagger-ui.urls[1].name=Forum API
springdoc.swagger-ui.urls[1].url=/forum/v3/api-docs

