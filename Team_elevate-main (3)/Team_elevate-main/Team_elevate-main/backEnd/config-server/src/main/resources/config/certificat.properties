server.port=8022
welcome.message=Welcome to Certificat microservice

spring.datasource.url=jdbc:mysql://localhost:3306/db_elevate_certificat?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

springdoc.api-docs.path=/certificats/v3/api-docs



springdoc.hateoas.enabled=false
springdoc.data-rest.enabled=false

# Logging pour le debogage
logging.level.org.springdoc=DEBUG


# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


management.endpoints.web.exposure.include=refresh
# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MY_EMAIL_USER:placeholder@gmail.com}
spring.mail.password=${MY_EMAIL_PASS:placeholder_pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.forward-headers-strategy=framework
