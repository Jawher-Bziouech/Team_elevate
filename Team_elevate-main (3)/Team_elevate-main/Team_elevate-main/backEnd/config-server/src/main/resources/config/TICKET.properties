server.port=8000

spring.datasource.url=jdbc:mysql://localhost:3306/db_elevate_ticket?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=refresh







# Server

welcome.message=welcome to ticket ms

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect




# Logging pour le débogage
logging.level.org.springdoc=DEBUG


server.forward-headers-strategy=framework
springdoc.api-docs.path=/tickets/v3/api-docs

# Config Server (désactivé si non utilisé)

spring.cloud.config.import-check.enabled=false

# Feign Client Configuration
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
# Logging pour voir les erreurs
logging.level.org.hibernate=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot=DEBUG
