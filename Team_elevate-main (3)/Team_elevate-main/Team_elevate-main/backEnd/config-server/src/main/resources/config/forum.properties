server.port=8023
welcome.message=Welcome to Forum microservice (Configured via Server)

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/db_elevate_forum?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

management.endpoints.web.exposure.include=health,info,prometheus,metrics,refresh
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

springdoc.api-docs.path=/forum/v3/api-docs

server.forward-headers-strategy=framework
