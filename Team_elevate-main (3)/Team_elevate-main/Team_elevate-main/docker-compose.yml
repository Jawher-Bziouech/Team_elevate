      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/db_elevate_quiz?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=

