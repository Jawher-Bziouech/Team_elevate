# SkillUp / Team Elevate — Full Stack Docker Compose
#
# Usage:
#   docker compose up -d           → build images and start all containers
#   docker compose ps              → verify all containers are Up
#   docker compose logs -f <svc>   → tail logs for a service
#   docker compose down -v         → stop everything and remove volumes

networks:
  elevate-net:
    driver: bridge

volumes:
  mysql_data:
  grafana_data:

services:

  # ─── Infrastructure ─────────────────────────────────────────────────────────

  mysqldb:
    image: mysql:8.0
    container_name: mysqldb
    restart: unless-stopped
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_ROOT_PASSWORD=
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - elevate-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  eureka:
    build: ./backEnd/eureka
    image: wassimhamouda/eureka:latest
    container_name: eureka
    restart: on-failure
    ports:
      - "8761:8761"
    networks:
      - elevate-net
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  config-server:
    build: ./backEnd/config-server
    image: wassimhamouda/config-server:latest
    container_name: config-server
    restart: on-failure
    ports:
      - "8888:8888"
    networks:
      - elevate-net
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  gateway:
    build: ./backEnd/gateway
    image: wassimhamouda/gateway:latest
    container_name: gateway
    restart: on-failure
    ports:
      - "9090:9090"
    networks:
      - elevate-net
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888

  # ─── Microservices ──────────────────────────────────────────────────────────

  user:
    build: ./backEnd/microservices/user
    image: wassimhamouda/user:latest
    container_name: user
    restart: on-failure
    ports:
      - "8024:8024"
    networks:
      - elevate-net
    depends_on:
      mysqldb:
        condition: service_healthy
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/db_elevate_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - JWT_SECRET=c2tpbGx1cC1qd3Qtc2VjcmV0LWtleS0yMDI0LWVzcHJpdC1hcHBsaWNhdGlvbg==

  quiz:
    build: ./backEnd/microservices/Quiz
    image: wassimhamouda/quiz:latest
    container_name: quiz
    restart: on-failure
    ports:
      - "8025:8025"
    networks:
      - elevate-net
    depends_on:
