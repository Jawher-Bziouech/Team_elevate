      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/db_elevate_formation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
