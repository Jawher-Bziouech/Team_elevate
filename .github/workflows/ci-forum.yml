    paths:
      - 'Team_elevate-main ?3?/Team_elevate-main/Team_elevate-main/backEnd/microservices/forum/**'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-microservice-ci.yml
