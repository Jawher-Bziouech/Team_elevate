name: Reusable Microservice CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests
        run: |
          cd "${{ inputs.service_path }}"
          mvn test

      - name: Build and Package
        run: |
          cd "${{ inputs.service_path }}"
          mvn clean package -DskipTests
