# ==============================================================
# Team Elevate — Kubernetes Manifests
# Full microservices deployment on kubeadm cluster
# ==============================================================

# ── NAMESPACE ──────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: team-elevate
  labels:
    app.kubernetes.io/managed-by: kubectl

---
# ── CONFIG MAP (shared env) ─────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: team-elevate-config
  namespace: team-elevate
data:
  EUREKA_SERVER_URL: "http://eureka:8761/eureka"
  CONFIG_SERVER_URL: "http://config-server:8888"
  SPRING_PROFILES_ACTIVE: "docker"

---
# ══════════════════════════════════════════════════════════════
# INFRASTRUCTURE SERVICES
# ══════════════════════════════════════════════════════════════

# ── EUREKA (Service Discovery) ──────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: team-elevate
  labels:
    app: eureka
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: jawher20/eureka:latest
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: eureka
  namespace: team-elevate
spec:
  selector:
    app: eureka
  ports:
    - port: 8761
      targetPort: 8761
  type: ClusterIP

---
# ── CONFIG SERVER ───────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: team-elevate
  labels:
    app: config-server
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      initContainers:
        - name: wait-for-eureka
          image: busybox
          command: ['sh', '-c', 'until nc -z eureka 8761; do echo waiting for eureka; sleep 3; done']
      containers:
        - name: config-server
          image: jawher20/config-server:latest
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: team-elevate-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: team-elevate
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
  type: ClusterIP

---
# ── API GATEWAY ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: team-elevate
  labels:
    app: gateway
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
        - name: wait-for-config
          image: busybox
          command: ['sh', '-c', 'until nc -z config-server 8888; do echo waiting for config-server; sleep 3; done']
      containers:
        - name: gateway
          image: jawher20/gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: team-elevate-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: team-elevate
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: NodePort

---
