# ══════════════════════════════════════════════════════════════
# HORIZONTAL POD AUTOSCALER (Excellence bonus)
# Automatically scales user-service & internship-service under load
# ══════════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service-hpa
  namespace: team-elevate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: internship-service-hpa
  namespace: team-elevate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: internship-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
